

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MX Records Dashboard</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        :root {
            --bg: #f5f8fc;
            --surface: #ffffff;
            --border: #e3eaf3;
            --text: #172b4d;
            --muted: #667995;
            --blue: #2878e8;
            --green: #16a66a;
            --amber: #e9a008;
            --red: #e5484d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 28px;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 system-ui, sans-serif;
        }

        button { font: inherit; }

        .container {
            max-width: 1500px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: -.6px;
        }

        .subtitle, .muted {
            color: var(--muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .refresh-button {
            border: 0;
            border-radius: 9px;
            background: #e5efff;
            color: var(--blue);
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 650;
        }

        .refresh-button:hover {
            background: #d5e5ff;
        }

        .refresh-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .last-updated {
            font-size: 12px;
            color: var(--muted);
        }

        .dashboard {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 22px;
        }

        .stat {
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            min-width: 0;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: 750;
            margin-top: 5px;
        }

        .stat-detail {
            color: var(--muted);
            font-size: 12px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table {
            width: 100%;
            min-width: 920px;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            background: #f8faff;
            color: #536987;
            font-size: 12px;
            font-weight: 700;
        }

        tbody tr:last-child td { border-bottom: 0; }

        tbody tr:hover { background: #fafcff; }

        .domain {
            font-weight: 700;
            white-space: nowrap;
        }

        .mx-list {
            min-width: 180px;
            overflow-wrap: anywhere;
            font-family: ui-monospace, monospace;
            font-size: 12px;
            line-height: 1.9;
        }

        .mx-record {
            display: block;
        }

        .mx-priority {
            color: var(--muted);
            display: inline-block;
            min-width: 28px;
        }

        .progress-cell { min-width: 190px; }

        .progress-line {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-track {
            height: 10px;
            flex: 1;
            min-width: 80px;
            background: #e9eef5;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: inherit;
            transition: width .35s ease;
        }

        .progress-value {
            min-width: 40px;
            font-size: 12px;
            font-weight: 700;
        }

        .green { background: var(--green); }
        .amber { background: var(--amber); }
        .red { background: var(--red); }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 99px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status.correct {
            color: #087b4c;
            background: #dcf8e9;
        }

        .status.partial {
            color: #9a6500;
            background: #fff1cf;
        }

        .status.mismatch {
            color: #c52b31;
            background: #ffe2e3;
        }

        .status.empty {
            color: #52647c;
            background: #e9eef5;
        }

        .footer {
            padding-top: 18px;
            color: var(--muted);
            font-size: 12px;
        }

        .htmx-request .refresh-icon {
            display: inline-block;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            body { padding: 16px; }
            .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .header { align-items: flex-start; flex-direction: column; }
        }

        @media (max-width: 480px) {
            .stats { grid-template-columns: 1fr; }
            .dashboard { padding: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header class="header">
        <div>
            <h1>✉ MX Records Dashboard</h1>
            <div class="subtitle">
                Monitor expected and actual MX records for your domains.
            </div>
        </div>

        <div class="header-actions">
            <button
                class="refresh-button"
                type="button"
                hx-get="{% url 'mx_dashboard_data' %}"
                hx-target="#dashboard-content"
                hx-swap="innerHTML"
                hx-disabled-elt="this"
            >
                <span class="refresh-icon">↻</span>
                Refresh
            </button>

            <div class="last-updated">
                Last updated<br>
                <strong>{{ last_updated|date:"d/m/Y H:i" }}</strong>
            </div>
        </div>
    </header>

    <main
        id="dashboard-content"
        class="dashboard"
        hx-get="{% url 'mx_dashboard_data' %}"
        hx-trigger="every 5m"
        hx-swap="innerHTML"
    >
        {% include "dashboard/partials/mx_dashboard_content.html" %}
    </main>
</div>
</body>
</html>
